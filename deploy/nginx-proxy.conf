# Reverse proxy in front of the blue/green app containers.
# The active container is set in sprite-maker-upstream.conf, which bluegreen.sh writes.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # The app enforces its own 5 MB limit and returns a clear JSON error. This only has
    # to be large enough for that error to come from the app instead of nginx.
    client_max_body_size 16m;

    # Docker's DNS, looked up at request time. An app container that restarts can get a
    # new IP, and a name resolved once at startup would keep returning 502 afterwards.
    resolver 127.0.0.11 valid=5s ipv6=off;
    include /etc/nginx/sprite-maker-upstream.conf;

    location / {
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # Generation can take several minutes (app/ai_client.py allows 240 s per AI call).
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
