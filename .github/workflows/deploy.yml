name: Deploy to self-hosted runner

# Runs after ci.yml finishes. The name below must match the `name:` in ci.yml.
on:
  workflow_run:
    workflows: ["Build and push Docker image"]
    types: [completed]
    branches: [main]

# Read access is only for checking out deploy/ from main.
permissions:
  contents: read

# Never run two deployments at once; a newer pending one replaces an older pending one.
concurrency:
  group: deploy-sprite-maker
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub evaluates this before a runner is assigned. In a public repository the
    # branch filter above is not enough: it matches a fork's branch named main too.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    # Allows for the old container finishing a running generation (see DRAIN_SECONDS).
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      # head_sha is the commit CI built. github.sha would be the latest commit on main.
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sprite-maker:${{ github.event.workflow_run.head_sha }}
      DEPLOY_PREFIX: sprite-maker
      PROXY_PORT: "8000"
      APP_URL: http://127.0.0.1:8000
      PROXY_IMAGE: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311

    steps:
      # github.sha on workflow_run is the commit this workflow file came from, so the
      # scripts always match the workflow. Only code already on main can reach this.
      - name: Check out deploy scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Docker
        run: |
          # A runner started as a service may not inherit the login shell's PATH.
          if ! command -v docker >/dev/null 2>&1; then
            for dir in /Applications/Docker.app/Contents/Resources/bin "$HOME/.docker/bin" /usr/local/bin /opt/homebrew/bin; do
              if [ -x "$dir/docker" ]; then
                export PATH="$dir:$PATH"
                echo "$dir" >> "$GITHUB_PATH"
                echo "Added $dir to PATH"
                break
              fi
            done
          fi
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Docker CLI를 찾을 수 없습니다. Docker Desktop 설치를 확인하세요."
            exit 1
          fi

          # Resolve the engine socket from the owner's Docker context now, because the
          # next lines switch DOCKER_CONFIG and contexts are stored in that directory.
          if ! docker_host="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"; then
            echo "::error::Docker context를 읽을 수 없습니다."
            exit 1
          fi
          export DOCKER_HOST="$docker_host"
          echo "DOCKER_HOST=$docker_host" >> "$GITHUB_ENV"

          if ! server_version="$(docker version --format '{{.Server.Version}}')"; then
            echo "::error::Docker 엔진에 연결할 수 없습니다. 맥북에서 Docker Desktop이 실행 중인지 확인하세요."
            exit 1
          fi
          echo "Docker engine $server_version is running"

          # Keep the Docker Hub token in a throwaway directory, away from the owner's
          # own login in the macOS keychain. An entry under "auths" stops the CLI from
          # auto-selecting the osxkeychain helper, so the token stays in this file.
          umask 077
          docker_config="$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")"
          echo '{"auths":{"https://index.docker.io/v1/":{}}}' > "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      # A separate process that outlives this step. Nothing is changed until it has seen
      # the current service answer normally.
      - name: Start monitoring
        run: |
          if ! python3 -c 'import sys; sys.exit(sys.version_info < (3, 9))'; then
            echo "::error::모니터링에 필요한 Python 3.9 이상을 찾을 수 없습니다."
            exit 1
          fi
          monitor_dir="$RUNNER_TEMP/deploy-monitor"
          mkdir -p "$monitor_dir"
          echo "MONITOR_DIR=$monitor_dir" >> "$GITHUB_ENV"
          nohup python3 deploy/monitor.py run --dir "$monitor_dir" --url "$APP_URL/health" \
            > "$monitor_dir/monitor-process.log" 2>&1 &

          if ! docker container inspect "$DEPLOY_PREFIX-proxy" >/dev/null 2>&1 \
            && ! docker container inspect "$DEPLOY_PREFIX" >/dev/null 2>&1; then
            echo "::warning::실행 중인 서비스가 없어 배포 전 상태 확인을 건너뜁니다 (최초 배포)."
          elif ! python3 deploy/monitor.py wait-healthy --dir "$monitor_dir"; then
            echo "::error::현재 서비스가 $APP_URL/health 에 정상 응답하지 않아 배포를 시작하지 않습니다. 맥북에서 컨테이너 상태를 먼저 확인하세요."
            exit 1
          fi
          python3 deploy/monitor.py mark --dir "$monitor_dir" deploy_start

      # Runs before anything is replaced, so a missing key cannot take the service down.
      - name: Check API key file
        run: |
          env_file="$HOME/.sprite-maker/.env"
          if [ ! -f "$env_file" ]; then
            echo "::error::API 키 파일이 없어 배포를 중단합니다: ~/.sprite-maker/.env 파일을 맥북에 만드세요. 기존 컨테이너는 그대로 둡니다."
            exit 1
          fi
          if [ ! -s "$env_file" ] || [ ! -r "$env_file" ]; then
            echo "::error::API 키 파일이 비어 있거나 읽을 수 없어 배포를 중단합니다: ~/.sprite-maker/.env"
            exit 1
          fi
          mode="$(stat -f '%Lp' "$env_file")"
          if [ "$mode" != "600" ]; then
            echo "::warning::~/.sprite-maker/.env 권한이 $mode 입니다. chmod 600을 권장합니다."
          fi
          echo "SPRITE_ENV_FILE=$env_file" >> "$GITHUB_ENV"
          echo "API key file found (contents not read)"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Pull images
        run: |
          docker pull "$IMAGE"
          docker pull "$PROXY_IMAGE"

      - name: Switch to the new version
        id: switch
        run: bash deploy/bluegreen.sh

      # Everything from here on also runs after a failure, so the log and summary remain.
      - name: Finish monitoring
        if: always()
        run: |
          if [ -n "${MONITOR_DIR:-}" ]; then
            python3 deploy/monitor.py mark --dir "$MONITOR_DIR" deploy_end
            python3 deploy/monitor.py wait-exit --dir "$MONITOR_DIR"
          fi

      - name: Write summary
        if: always()
        env:
          DEPLOY_RESULT: ${{ job.status }}
          DEPLOY_MODE: ${{ steps.switch.outputs.mode }}
          FROM_COLOR: ${{ steps.switch.outputs.from_color }}
          TO_COLOR: ${{ steps.switch.outputs.to_color }}
          FAILURE_REASON: ${{ steps.switch.outputs.failure_reason }}
        run: |
          if [ -n "${MONITOR_DIR:-}" ]; then
            python3 deploy/monitor.py summary --dir "$MONITOR_DIR" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ 배포 실패: 모니터링 시작 전 단계에서 중단됨 (로그 참고)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload monitoring log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-monitor-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/deploy-monitor
          if-no-files-found: warn
          retention-days: 14

      - name: Remove Docker Hub credentials
        if: always()
        run: |
          case "${DOCKER_CONFIG:-}" in
            "$RUNNER_TEMP"/docker-config.*) rm -rf "$DOCKER_CONFIG" ;;
          esac
